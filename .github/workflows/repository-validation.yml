name: Repository Validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  repository-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Unity project files
        shell: bash
        run: |
          set -euo pipefail
          test -f ProjectSettings/ProjectVersion.txt
          test -f Packages/manifest.json
          test -d Assets

      - name: Validate shared game architecture
        shell: bash
        run: |
          set -euo pipefail
          test -f Assets/_Project/Scripts/Core/IMiniGame.cs
          test -f Assets/_Project/Scripts/Core/MiniGameDefinition.cs
          test -f Assets/_Project/Scripts/Core/MiniGameCatalog.cs
          test -f Assets/_Project/Scripts/Core/GameCatalog.cs
          test -f Assets/_Project/Scripts/Core/MiniGameSession.cs
          test -f Assets/_Project/Scripts/Core/SessionProgress.cs
          test -f Assets/_Project/Scripts/Core/MiniGameRunner.cs

      - name: Validate required game source
        shell: bash
        run: |
          set -euo pipefail
          test -f Assets/_Project/Scripts/MiniGames/MiniGameCollection.cs
          test -f Assets/_Project/Scripts/MiniGames/TapRushGame.cs
          test -f Assets/_Project/Scripts/MiniGames/ProductionMiniGameBase.cs
          test -f Assets/_Project/Scripts/MiniGames/CoinCatchGame.cs
          test -f Assets/_Project/Scripts/MiniGames/MemoryFlipGame.cs
          test -f Assets/_Project/Scripts/MiniGames/OneTapJumpGame.cs

      - name: Validate canonical game ids
        shell: bash
        run: |
          set -euo pipefail
          catalog='Assets/_Project/Scripts/Core/MiniGameCatalog.cs'
          for id in tap_rush color_match stack_it dodge_line coin_catch memory_flip one_tap_jump ball_sort parking_puzzle merge_2048; do
            grep -q "Id = \"$id\"" "$catalog"
          done

      - name: Validate no obvious secret files
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name '*.p12' -o -name '*.keystore' -o -name '*.jks' \) -not -path './.git/*' | grep -q .; then
            echo 'Signing material must not be committed.'
            exit 1
          fi
